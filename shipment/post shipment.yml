info:
  name: post shipment
  type: http

http:
  method: POST
  url: http://127.0.0.1:5000/shipment
  body:
    type: json
    data: |-
      {
        "weight" : 20, 
        "destination" : "DC", 
        "driver_id" : 4
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
